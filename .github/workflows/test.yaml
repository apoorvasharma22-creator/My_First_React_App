name: Create a S3 Bucket

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  creating_bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/${{ secrets.IAM_ROLE }}"
          aws-region: eu-north-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
        run: |
          terraform plan \
            -var="bucket_name=$BUCKET_NAME"
        working-directory: terraform

      - name: Terraform Apply
        env:
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
        run: terraform apply -auto-approve
        working-directory: terraform

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Upload dist to S3
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: aws s3 sync dist "s3://$BUCKET_NAME" --delete

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
